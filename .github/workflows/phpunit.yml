name: Codes Controller Tests

on:
  push:
    branches:
      - main
      - develop
      - feature/**
  pull_request:
    branches:
      - main
      - develop

jobs:
  feature-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: cbdb_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: mbstring, xml, ctype, iconv, curl, pdo_mysql, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-suggest

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Configure test environment
        run: |
          sed -i 's/DB_DATABASE=homestead/DB_DATABASE=cbdb_test/' .env
          sed -i 's/DB_USERNAME=homestead/DB_USERNAME=root/' .env
          sed -i 's/DB_PASSWORD=secret/DB_PASSWORD=password/' .env
          sed -i 's/CACHE_DRIVER=file/CACHE_DRIVER=array/' .env
          sed -i 's/SESSION_DRIVER=file/SESSION_DRIVER=array/' .env

      - name: Run database migrations
        run: php artisan migrate --force

      - name: Run PHPUnit suite
        run: ./vendor/bin/phpunit
