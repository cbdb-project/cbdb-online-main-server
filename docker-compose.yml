version: "3.9"

services:
  # FrankenPHP 服务（替代原来的 php + web 两个容器）
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: cbdb-frankenphp
    volumes:
      # 映射代码，git pull 即可生效
      - .:/app
      # 独立的 vendor 目录（容器专用，避免本地和容器冲突）
      - vendor:/app/vendor
      # 独立的 node_modules 目录（容器专用）
      - node_modules:/app/node_modules
      # SQLite 数据库目录
      - ./database:/app/database
    environment:
      # Laravel 环境变量
      APP_ENV: local
      APP_DEBUG: "true"
      # SQLite 配置
      DB_CONNECTION: sqlite
      DB_DATABASE: /app/database/database.sqlite3
      # FrankenPHP 配置
      SERVER_NAME: :80
      FRANKENPHP_CONFIG: |
        {
          frankenphp {
            num_threads 4
          }
        }
    ports:
      # 本地 8000 端口映射到容器 80
      - "8000:80"
      # HTTPS 端口（可选）
      # - "8443:443"
      # - "8443:443/udp"
    networks:
      - laravel-net
    # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  laravel-net:
    driver: bridge

volumes:
  vendor:
    driver: local
  node_modules:
    driver: local
