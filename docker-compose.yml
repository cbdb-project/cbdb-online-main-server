version: "3.9"

services:
  php:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: cbdb-php
    volumes:
      - .:/var/www/html                                    # 映射代码，git pull 即可生效
      - ./database:/var/www/html/database                  # SQLite 数据库目录
      - ./docker/php.ini:/usr/local/etc/php/conf.d/custom.ini  # PHP 配置
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/test.sqlite
    networks:
      - laravel-net
    depends_on:
      - web

  web:
    image: nginx:alpine
    container_name: cbdb-nginx
    volumes:
      - .:/var/www/html                           # 映射代码
      - ./docker/nginx.conf:/etc/nginx/nginx.conf # Nginx 配置
    ports:
      - "8000:80"                                 # 本地 8000 端口映射到容器 80
    networks:
      - laravel-net

networks:
  laravel-net:
    driver: bridge
