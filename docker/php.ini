; PHP 配置文件（开发环境）

; 错误报告
display_errors = On
display_startup_errors = On
; E_ALL & ~E_DEPRECATED & ~E_STRICT 排除 deprecation 和 strict 警告
; PHP 8.1+ 與 Laravel 8.83 兼容性：隱藏 deprecation 警告
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; 日志
log_errors = On
error_log = /var/log/php/error.log

; 文件上传
upload_max_filesize = 20M
post_max_size = 20M

; 执行时间
max_execution_time = 300
max_input_time = 300

; 内存限制
memory_limit = 256M

; 时区
date.timezone = Asia/Shanghai

; 其他
expose_php = Off
