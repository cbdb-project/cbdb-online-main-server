; PHP 配置文件（开发环境）

; 错误报告
display_errors = On
display_startup_errors = On
error_reporting = E_ALL

; 日志
log_errors = On
error_log = /var/log/php/error.log

; 文件上传
upload_max_filesize = 20M
post_max_size = 20M

; 执行时间
max_execution_time = 300
max_input_time = 300

; 内存限制
memory_limit = 256M

; 时区
date.timezone = Asia/Shanghai

; 其他
expose_php = Off
